services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ad-portal-app:latest
    container_name: ad-portal-app
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./public:/var/www/html/public
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
      - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./.env:/var/www/html/.env
      - "./Report Data Strukture:/var/www/html/Report Data Strukture"
      - ./mhs-reports:/var/www/html/mhs-reports
    networks:
      - ad-portal-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: ad-portal-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ad-portal-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: ad-portal-db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ad_portal_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Secret_DB_Password_2026!}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Secret_DB_Password_2026!}
      MYSQL_USER: ${DB_USERNAME:-ad_portal_user}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ad-portal-network

volumes:
  mysql_data:
    driver: local

networks:
  ad-portal-network:
    driver: bridge
